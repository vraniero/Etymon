name: Etymon
options:
  bundleIdPrefix: com.ranierovirgilio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9P2NQ693B3
    CODE_SIGN_STYLE: Automatic
targets:
  Etymon:
    type: application
    platform: iOS
    sources: [Etymon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ranierovirgilio.etymon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Etymon
        INFOPLIST_KEY_NSCameraUsageDescription: Etymon reads the words around you to show how they are related.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Etymon reads the words in a photo to show how they are related.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Etymon listens to the people talking around you, to show how the words they say are related.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Etymon remembers where you found the words of a scene you save.
    info:
      path: Etymon/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Etymon talks to its development server on your network.
  EtymonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EtymonTests]
    dependencies:
      - target: Etymon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EtymonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EtymonUITests
        excludes: ["*.png"]
    dependencies:
      - target: Etymon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Etymon
schemes:
  Etymon:
    build:
      targets:
        Etymon: all
        EtymonTests: [test]
        EtymonUITests: [test]
    test:
      targets: [EtymonTests, EtymonUITests]
