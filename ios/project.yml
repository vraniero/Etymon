name: Etymon
options:
  bundleIdPrefix: com.ranierovirgilio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Etymon:
    type: application
    platform: iOS
    sources: [Etymon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ranierovirgilio.etymon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Etymon
        INFOPLIST_KEY_NSCameraUsageDescription: Etymon reads the words around you to show how they are related.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Etymon reads the words in a photo to show how they are related.
    info:
      path: Etymon/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Etymon talks to its development server on your network.
  EtymonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EtymonTests]
    dependencies:
      - target: Etymon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Etymon:
    build:
      targets:
        Etymon: all
        EtymonTests: [test]
    test:
      targets: [EtymonTests]
