name: Etymon
options:
  bundleIdPrefix: com.ranierovirgilio
  deploymentTarget:
    iOS: "26.4"  # Apple-hosted Background Assets (language packs)
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9P2NQ693B3
    CODE_SIGN_STYLE: Automatic
    # the app and its extension carry the same version (the App Store requires it)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Etymon:
    type: application
    platform: iOS
    sources: [Etymon]
    dependencies:
      - target: EtymonPacks
    entitlements:
      path: Etymon/Etymon.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ranierovirgilio.etymon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ranierovirgilio.etymon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Etymon
        INFOPLIST_KEY_NSCameraUsageDescription: Etymon reads the words around you to show how they are related.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Etymon reads the words in a photo to show how they are related.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Etymon listens to the people talking around you, to show how the words they say are related.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Etymon remembers where you found the words of a scene you save.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Etymon turns what people say into words on your iPhone, to show how they are related.
    info:
      path: Etymon/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Etymon talks to its development server on your network.
        # the dictionary comes in packs hosted by the App Store: a core, then each language
        ITSAppUsesNonExemptEncryption: false
        BAAppGroupID: group.com.ranierovirgilio.etymon
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
  # Downloads the dictionary's packs in the background (Apple-hosted Background Assets)
  EtymonPacks:
    type: extensionkit-extension
    platform: iOS
    sources: [EtymonPacks]
    entitlements:
      path: EtymonPacks/EtymonPacks.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ranierovirgilio.etymon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ranierovirgilio.etymon.packs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Etymon Packs
    info:
      path: EtymonPacks/Info.plist
      properties:
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
  EtymonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EtymonTests]
    dependencies:
      - target: Etymon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EtymonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EtymonUITests
        excludes: ["*.png"]
    dependencies:
      - target: Etymon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Etymon
schemes:
  Etymon:
    build:
      targets:
        Etymon: all
        EtymonTests: [test]
        EtymonUITests: [test]
    test:
      targets: [EtymonTests, EtymonUITests]
